<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bebzun</title>
    <style>
        @font-face { 
            font-family: 'MojaCzcionka'; 
            src: url('ok.ttf?v=1') format('truetype');
            font-display: swap;
        }

        body { 
            background: #000; color: #00ff00; 
            font-family: 'MojaCzcionka', sans-serif; 
            margin: 0; overflow-y: auto; text-align: center;
            display: flex; flex-direction: column; align-items: center;
            padding-bottom: 30px;
        }

        canvas { 
            border: 4px solid #00ff00; background: #0a0a0a; 
            display: block; margin: 10px auto; box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            touch-action: none;
        }

        .ui-panel { 
            width: 320px; padding: 10px; 
            touch-action: auto;
            position: relative; z-index: 100;
            box-sizing: border-box;
        }

        .skin-panel {
            background: #111; border: 2px solid #00ffff; border-radius: 15px;
            padding: 12px; margin-top: 10px; text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .skin-panel h3 { margin: 0 0 10px 0; color: #00ffff; font-size: 18px; }

        .skins-grid {
            display: flex; flex-direction: column; gap: 8px;
        }

        .skin-card {
            background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
            padding: 8px 10px; display: flex; align-items: center;
            justify-content: space-between; font-size: 13px;
        }

        .skin-info {
            display: flex; align-items: center; gap: 10px; text-align: left;
        }

        .skin-img {
            width: 35px; height: 35px; object-fit: contain;
            border: 1px solid #555; border-radius: 5px; background: #000;
        }

        .skin-btn {
            background: #00ff00; color: #000; border: none; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-weight: bold;
            font-family: inherit; font-size: 11px;
        }

        .skin-btn.active {
            background: #ff00ff; color: #fff; cursor: default;
        }

        .skin-btn.buy {
            background: #ffcc00; color: #000;
        }

        .skin-btn:disabled {
            opacity: 0.5; cursor: not-allowed;
        }
        
        .leaderboard {
            background: #111; border: 2px solid #ffcc00; border-radius: 15px;
            padding: 10px; margin-top: 15px; text-align: left;
        }

        .leaderboard h3 { margin: 0 0 10px 0; color: #ffcc00; text-align: center; font-size: 18px; }
        
        .score-row { 
            display: flex; justify-content: space-between; 
            border-bottom: 1px dashed #333; padding: 5px 0; font-size: 14px;
        }

        .btn-back { 
            background: #ffcc00; color: #000; border: none; padding: 12px 25px; 
            border-radius: 10px; cursor: pointer; margin-top: 15px; font-weight: bold;
            font-family: inherit; width: 100%;
        }

        #game-over-msg { color: #ff0000; font-size: 20px; font-weight: bold; display: none; margin: 5px; }
    </style>
</head>
<body>

    <h2 style="color: #ffcc00; text-shadow: 0 0 10px #ffcc00; margin-bottom: 5px;">FLAPPY BEBZUN 🦆</h2>
    <div id="game-over-msg">O MÓJ BEBZUN! 💥</div>
    
    <canvas id="gameCanvas"></canvas>

    <div class="ui-panel">
        <!-- SKLEP ZE SKINAMI W GRACH -->
        <div class="skin-panel">
            <h3>🎨 WYBIERZ / KUP SKIN</h3>
            <div style="font-size: 12px; color: #ffcc00; margin-bottom: 10px;">
                🪙 Stan konta: <span id="skin-coin-count">0</span> OrkaCoin
            </div>
            <div class="skins-grid" id="skins-container">
                <!-- Generowane dynamicznie z JS -->
            </div>
        </div>

        <div class="leaderboard">
            <h3>🏆 NAJLEPSZE BRZUCHY</h3>
            <div id="leaderboard-list">Wczytywanie rekordów...</div>
        </div>

        <button class="btn-back" onclick="window.location.href='index.html'">POWRÓT DO MENU</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot, serverTimestamp, doc, getDoc, setDoc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPvjNjR6nTHQuWdhQGAGk9iJgvPKDQTXA",
            authDomain: "bebechchat.firebaseapp.com",
            projectId: "bebechchat",
            storageBucket: "bebechchat.firebasestorage.app",
            messagingSenderId: "738356779230",
            appId: "1:738356779230:web:2c41e46431284e3fb78a4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const loggedUser = localStorage.getItem('loggedUser') || "Anonim";

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // CONFIG KANWY HiDPI / 4K
        const LOGICAL_WIDTH = 320;
        const LOGICAL_HEIGHT = 480;

        function setupHiDPICanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = LOGICAL_WIDTH * dpr;
            canvas.height = LOGICAL_HEIGHT * dpr;
            canvas.style.width = LOGICAL_WIDTH + "px";
            canvas.style.height = LOGICAL_HEIGHT + "px";
            ctx.scale(dpr, dpr);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
        }

        setupHiDPICanvas();

        // SKIN DEFINITIONS (USUNIĘTO KRÓLIKA I BEBECHA, OBSŁUGA OBSŁUGIWANIA SKINÓW POZOSTAŁA)
        const SKINS = [
            { id: 'bebzun', name: 'Bebzun', price: 0, img: 'Bebuch.png' }
        ];

        // Słownik obrazków pomocniczych do ładowania dynamicznych skinów ze sklepu
        const SKIN_IMAGES = {
            'bebzun': 'Bebuch.png',
            'bebech': 'brzuchgrubiutki.png',
            'krolik': 'unarmed.png'
        };

        // ASSETS
        const bebuchImg = new Image(); 
        bebuchImg.src = 'Bebuch.png';

        const chestImg = new Image(); 
        chestImg.src = 'Chest.jpg';

        let bird = { x: 50, y: 200, w: 45, h: 45, gravity: 0.5, lift: -8, velocity: 0 };
        let pipes = [];
        let frame = 0;
        let score = 0;
        let gameRunning = true;

        let jumpCount = 0;
        let totalCoins = 0;
        let unlockedSkins = ['bebzun'];
        let activeSkinId = 'bebzun';

        // WCZYTYWANIE MONET I SKINÓW GRACZA
        async function loadUserData() {
            if (loggedUser === "Anonim") {
                renderSkinsUI();
                return;
            }
            try {
                const userRef = doc(db, "users", loggedUser);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    totalCoins = data.coins || 0;
                    unlockedSkins = data.unlockedSkins || ['bebzun'];
                    if (!unlockedSkins.includes('bebzun')) unlockedSkins.push('bebzun');
                    
                    activeSkinId = data.activeSkin || 'bebzun';
                    
                    // Ustawienie obrazka według skina (z uwzględnieniem slownika dla skinów ze sklepu)
                    const activeImgSrc = SKIN_IMAGES[activeSkinId] || 'Bebuch.png';
                    bebuchImg.src = activeImgSrc;

                    document.getElementById("skin-coin-count").textContent = totalCoins;
                } else {
                    await setDoc(userRef, { coins: 0, unlockedSkins: ['bebzun'], activeSkin: 'bebzun' }, { merge: true });
                }
            } catch (e) {
                console.error("Błąd wczytywania danych użytkownika:", e);
            }
            renderSkinsUI();
        }

        function renderSkinsUI() {
            const container = document.getElementById("skins-container");
            document.getElementById("skin-coin-count").textContent = totalCoins;
            container.innerHTML = "";

            SKINS.forEach(skin => {
                const isUnlocked = unlockedSkins.includes(skin.id);
                const isActive = activeSkinId === skin.id;

                const card = document.createElement("div");
                card.className = "skin-card";

                let btnHtml = "";
                if (isActive) {
                    btnHtml = `<button class="skin-btn active">UŻYWANY</button>`;
                } else if (isUnlocked) {
                    btnHtml = `<button class="skin-btn" onclick="selectSkin('${skin.id}')">UŻYJ</button>`;
                } else {
                    const canAfford = totalCoins >= skin.price;
                    btnHtml = `<button class="skin-btn buy" ${!canAfford ? 'disabled' : ''} onclick="buySkin('${skin.id}', ${skin.price})">${skin.price} 🪙</button>`;
                }

                card.innerHTML = `
                    <div class="skin-info">
                        <img src="${skin.img}" class="skin-img" alt="${skin.name}">
                        <div>
                            <div style="font-weight: bold;">${skin.name}</div>
                            <div style="font-size: 10px; color: #888;">${skin.price > 0 ? skin.price + " OrkaCoinów" : "Darmowy"}</div>
                        </div>
                    </div>
                    ${btnHtml}
                `;
                container.appendChild(card);
            });
        }

        window.selectSkin = async function(skinId) {
            activeSkinId = skinId;
            bebuchImg.src = SKIN_IMAGES[skinId] || 'Bebuch.png';
            renderSkinsUI();

            if (loggedUser !== "Anonim") {
                try {
                    await updateDoc(doc(db, "users", loggedUser), {
                        activeSkin: skinId
                    });
                } catch(e) { console.error("Błąd zmiany skina:", e); }
            }
        };

        window.buySkin = async function(skinId, price) {
            if (totalCoins < price) {
                alert("Masz za mało OrkaCoinów!");
                return;
            }

            totalCoins -= price;
            unlockedSkins.push(skinId);
            activeSkinId = skinId;

            bebuchImg.src = SKIN_IMAGES[skinId] || 'Bebuch.png';

            renderSkinsUI();

            if (loggedUser !== "Anonim") {
                try {
                    const userRef = doc(db, "users", loggedUser);
                    await updateDoc(userRef, {
                        coins: increment(-price),
                        unlockedSkins: arrayUnion(skinId),
                        activeSkin: skinId
                    });
                } catch(e) { console.error("Błąd zakupu skina:", e); }
            }
        };

        loadUserData();

        let lastTime = 0;
        const fpsInterval = 1000 / 60;

        function resetGame() {
            bird.y = 200; bird.velocity = 0;
            pipes = []; score = 0; frame = 0;
            gameRunning = true;
            document.getElementById("game-over-msg").style.display = "none";
            
            lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        async function saveScore(s) {
            if(s <= 0) return;
            const scoreRef = doc(db, "scores", loggedUser);
            
            try {
                const snap = await getDoc(scoreRef);
                if (!snap.exists() || s > snap.data().score) {
                    await setDoc(scoreRef, {
                        user: loggedUser,
                        score: s,
                        timestamp: serverTimestamp()
                    });
                }
            } catch (e) { console.error("Błąd bazy:", e); }
        }

        async function addCoinToUser() {
            totalCoins++;
            document.getElementById("skin-coin-count").textContent = totalCoins;
            renderSkinsUI();

            if (loggedUser === "Anonim") return;
            
            try {
                const userRef = doc(db, "users", loggedUser);
                await updateDoc(userRef, {
                    coins: increment(1)
                });
            } catch (e) {
                console.error("Błąd zapisywania coina:", e);
            }
        }

        function drawBird() {
            ctx.drawImage(bebuchImg, bird.x, bird.y, bird.w, bird.h);
        }

        function drawPipes() {
            pipes.forEach(p => {
                ctx.drawImage(chestImg, p.x, p.top - 400, p.w, 400);
                ctx.drawImage(chestImg, p.x, LOGICAL_HEIGHT - p.bottom, p.w, 400);
                
                ctx.strokeStyle = "#ffcc00";
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, 0, p.w, p.top);
                ctx.strokeRect(p.x, LOGICAL_HEIGHT - p.bottom, p.w, p.bottom);
            });
        }

        function update() {
            if (!gameRunning) return;
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (frame % 100 === 0) {
                let gap = 135;
                let top = 50 + Math.random() * (LOGICAL_HEIGHT / 2.5);
                pipes.push({ x: LOGICAL_WIDTH, w: 50, top: top, bottom: LOGICAL_HEIGHT - top - gap, passed: false });
            }

            pipes.forEach(p => {
                p.x -= 2.5;
                if (bird.x + 8 < p.x + p.w && bird.x + bird.w - 8 > p.x &&
                    (bird.y + 8 < p.top || bird.y + bird.h - 8 > LOGICAL_HEIGHT - p.bottom)) {
                    endGame();
                }
                if (!p.passed && p.x + p.w < bird.x) {
                    score++;
                    p.passed = true;
                }
            });

            if (bird.y + bird.h > LOGICAL_HEIGHT || bird.y < 0) endGame();
            pipes = pipes.filter(p => p.x + p.w > -50);
            frame++;
        }

        function endGame() {
            gameRunning = false;
            document.getElementById("game-over-msg").style.display = "block";
            saveScore(score);
            setTimeout(resetGame, 1500);
        }

        function loop(timestamp) {
            if (!gameRunning) return;

            requestAnimationFrame(loop);

            let elapsed = timestamp - lastTime;
            if (elapsed < fpsInterval) return;

            lastTime = timestamp - (elapsed % fpsInterval);

            ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
            drawPipes();
            drawBird();
            update();
            
            ctx.fillStyle = "#ffcc00";
            ctx.font = "bold 22px Arial";
            ctx.fillText("BRZUCHY: " + score, 15, 30);

            ctx.fillStyle = "#00ffff";
            ctx.font = "bold 16px Arial";
            ctx.fillText("🪙 OrkaCoiny: " + totalCoins, 15, 55);
        }

        const flap = () => { 
            if(gameRunning) {
                bird.velocity = bird.lift; 
                jumpCount++;
                if (jumpCount % 5 === 0) {
                    addCoinToUser();
                }
            }
        };
        
        window.addEventListener("keydown", (e) => { if(e.code === "Space") flap(); });
        
        canvas.addEventListener("touchstart", (e) => { 
            e.preventDefault(); 
            flap(); 
        }, { passive: false });

        function loadLeaderboard() {
            const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(5));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const data = d.data();
                    list.innerHTML += `
                        <div class="score-row">
                            <span style="color:#00ff00">${data.user}</span> 
                            <span style="color:#ffcc00; font-weight:bold;">${data.score}</span>
                        </div>`;
                });
            });
        }

        loadLeaderboard();
        
        lastTime = performance.now();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
