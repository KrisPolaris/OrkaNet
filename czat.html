<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BebechChat 💬</title>
<style>
    @font-face { 
        font-family: 'MojaCzcionka'; 
        src: url('ok.woff2') format('woff2'), 
             url('ok.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    * {
        box-sizing: border-box;
    }

    html {
        height: 100%;
    }

    body { 
        background: #000; color: #00ff00; 
        font-family: 'MojaCzcionka', Arial, sans-serif;
        display: flex; flex-direction: column; 
        height: 100vh;
        height: 100dvh; /* Obsługa dynamicznej wysokości dla urządzeń mobilnych */
        margin: 0; 
        overflow: hidden;
        position: relative;
    }
    
    input, button, .room-btn, h2 {
        font-family: 'MojaCzcionka', Arial, sans-serif !important;
    }

    .chat-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 15px; background: #0a0a0a; border-bottom: 2px solid #00ff00;
        flex-shrink: 0;
        z-index: 10;
    }

    .header-left {
        display: flex; align-items: center;
    }

    #header-logo {
        width: 45px; height: 45px; border-radius: 50%;
        border: 2px solid #00ff00; margin-right: 12px;
        box-shadow: 0 0 10px #00ff00; object-fit: cover; cursor: pointer;
    }

    .chat-selector {
        display: flex; justify-content: flex-start; gap: 8px;
        padding: 10px; background: #111;
        flex-shrink: 0;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    .room-btn {
        padding: 8px 15px; font-size: 11px; background: #222;
        color: #00ff00; border: 1px solid #00ff00; border-radius: 20px;
        cursor: pointer; white-space: nowrap;
    }

    .room-btn.active {
        background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00;
    }

    #chat-window { 
        flex: 1; 
        min-height: 0;
        overflow-y: auto; padding: 15px; 
        display: flex; flex-direction: column;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
    }

    .msg { 
        position: relative; margin-bottom: 15px; padding: 12px; 
        border-radius: 18px; max-width: 85%; width: fit-content; 
        word-wrap: break-word;
    }

    .msg-left { background: #1a1a1a; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #333; }
    .msg-right { background: #004d00; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #00ff00; }
    .msg-bot { border: 1px solid #ffcc00 !important; box-shadow: 0 0 5px #ffcc00; }
    .msg-dm { border: 1px solid #ff00ff !important; box-shadow: 0 0 8px #ff00ff; }

    .user { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; color: #00ff00; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* Stylik dla Rang (Badges) */
    .role-badge {
        font-size: 0.65rem;
        padding: 2px 6px;
        border-radius: 6px;
        font-weight: bold;
        text-shadow: none;
        display: inline-block;
        letter-spacing: 0.5px;
    }
    .role-pro { background: #3b82f6; color: #ffffff; border: 1px solid #60a5fa; }
    .role-vip { background: #eab308; color: #000000; border: 1px solid #fde047; font-weight: 900; }
    .role-epic { background: #a855f7; color: #ffffff; border: 1px solid #c084fc; box-shadow: 0 0 5px #a855f7; }
    .role-chatter { background: #06b6d4; color: #000000; border: 1px solid #22d3ee; }
    .role-moderator { background: #ef4444; color: #ffffff; border: 1px solid #f87171; box-shadow: 0 0 8px #ef4444; animation: modGlow 1.5s infinite alternate; }

    @keyframes modGlow {
        from { box-shadow: 0 0 3px #ef4444; }
        to { box-shadow: 0 0 10px #ef4444; }
    }

    .emoji { width: 24px; height: 24px; vertical-align: middle; margin: 0 2px; border-radius: 4px; }
    .chat-img { max-width: 100%; border-radius: 10px; margin-top: 8px; border: 1px solid #00ff00; display: block; cursor: pointer; }
    
    .del-btn { 
        position: absolute; right: -8px; top: -8px; 
        background: #ff0000; color: #fff; border: none; 
        border-radius: 50%; width: 20px; height: 20px; cursor: pointer;
        font-size: 10px; display: flex; align-items: center; justify-content: center;
    }

    /* POPRAWIONY PASEK WEJŚCIOWY DLA KOMÓREK */
    .input-area { 
        padding: 10px; background: #111; display: flex; gap: 6px; 
        border-top: 2px solid #00ff00; align-items: center;
        flex-shrink: 0;
        position: sticky;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
    }

    input { background: #222; border: 1px solid #00ff00; color: #fff; padding: 10px; border-radius: 8px; outline: none; flex: 1; min-width: 0; font-size: 14px; }
    
    button { background: #00ff00; color: #000; border: none; padding: 10px 12px; font-weight: bold; border-radius: 8px; cursor: pointer; white-space: nowrap; }

    /* Lista Znajomych - Podgląd w nagłówku */
    .friends-dropdown-btn {
        background: #111; color: #ff00ff; border: 1px solid #ff00ff; padding: 5px 10px; border-radius: 12px; font-size: 0.8rem; cursor: pointer;
    }
    #friends-menu {
        display: none; position: absolute; top: 60px; right: 15px; background: #000; border: 2px solid #ff00ff; padding: 10px; border-radius: 10px; z-index: 100; max-height: 200px; overflow-y: auto; width: 180px;
    }
    .friend-item {
        padding: 5px; color: #fff; font-size: 0.8rem; cursor: pointer; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center;
    }
    .friend-item:hover { background: #111; color: #00ff00; }
    .dm-badge { background: #ff00ff; color: #fff; border-radius: 10px; padding: 2px 6px; font-size: 0.6rem; margin-left: 5px; }
</style>
</head>
<body>

    <div class="chat-header">
        <div class="header-left">
            <img src="Bebe.jpg" id="header-logo">
            <h2 id="chat-title" style="margin:0; font-size: 1.2rem;">OGÓLNY 🌐</h2>
        </div>
        <div>
            <button class="friends-dropdown-btn" onclick="toggleFriendsMenu()">👥 Znajomi</button>
            <div id="friends-menu"></div>
        </div>
    </div>

    <div class="chat-selector" id="rooms-bar">
        <button id="btn-global" class="room-btn active" onclick="switchRoom('global', 'Bebe.jpg', 'OGÓLNY 🌐')">GŁÓWNY 1</button>
        <button id="btn-global2" class="room-btn" onclick="switchRoom('global2', 'Bebe.jpg', 'GŁÓWNY 2 🌍')">GŁÓWNY 2</button>
    </div>

    <div id="chat-window"></div>

    <div class="input-area">
        <input type="text" id="message" placeholder="Pisz tekst lub @username aby wysłać DM...">
        <input type="file" id="imageInput" accept="image/*" style="display:none">
        <button id="btn-img">🖼️</button>
        <button id="sendBtn">SEND</button>
        <button onclick="window.location.href='super.html'" style="background:#444; color:white;">X</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPvjNjR6nTHQuWdhQGAGk9iJgvPKDQTXA",
            authDomain: "bebechchat.firebaseapp.com",
            projectId: "bebechchat",
            storageBucket: "bebechchat.firebasestorage.app",
            messagingSenderId: "738356779230",
            appId: "1:738356779230:web:2c41e46431284e3fb78a4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const loggedUser = localStorage.getItem('loggedUser') || "Gość";
        let currentRoom = 'global';

        // dynamiczna obsługa wysuwania klawiatury na telefonach
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                document.body.style.height = `${window.visualViewport.height}px`;
                const win = document.getElementById('chat-window');
                if (win) win.scrollTop = win.scrollHeight;
            });
        }

        const userRolesCache = {};
        const MOD_LIST = ["krispolaris", "admin", "kris", "szym", "sim"];

        function getRoleBadgeHTML(userName, roleFromDb) {
            let role = (roleFromDb || "").toUpperCase();

            if (MOD_LIST.includes(userName.toLowerCase())) {
                role = "MODERATOR";
            }

            if (!role || role === "DEFAULT" || role === "NONE") return "";

            switch (role) {
                case "PRO":
                    return `<span class="role-badge role-pro">PRO</span>`;
                case "VIP":
                    return `<span class="role-badge role-vip">⭐ VIP</span>`;
                case "EPIC":
                    return `<span class="role-badge role-epic">🔥 EPIC</span>`;
                case "CHATTER":
                    return `<span class="role-badge role-chatter">💬 CHATTER</span>`;
                case "MODERATOR":
                    return `<span class="role-badge role-moderator">🛡️ MOD</span>`;
                default:
                    return `<span class="role-badge role-pro">${role}</span>`;
            }
        }

        async function getUserRole(userName) {
            if (userRolesCache[userName] !== undefined) {
                return userRolesCache[userName];
            }
            try {
                const userDoc = await getDoc(doc(db, "users", userName));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    const role = data.role || data.rank || "";
                    userRolesCache[userName] = role;
                    return role;
                }
            } catch (e) {
                console.error("Błąd pobierania rangi:", e);
            }
            userRolesCache[userName] = "";
            return "";
        }

        function getDMChannelId(user1, user2) {
            return "dm_" + [user1, user2].sort().join("_");
        }

        window.switchRoom = function(room, img, title) {
            currentRoom = room;
            document.getElementById('header-logo').src = img;
            document.getElementById('chat-title').innerText = title;
            document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
            
            const activeBtn = document.getElementById(`btn-${room}`);
            if(activeBtn) activeBtn.classList.add('active');
            
            listenToMessages();
        }

        async function botBebzun(userText) {
            const triggers = ['bebzun', 'bebech'];
            if (triggers.some(t => userText.toLowerCase().includes(t))) {
                setTimeout(async () => {
                    await addDoc(collection(db, "messages"), {
                        user: "Bebzun 🤖", 
                        text: "CZY JA BYŁEM PRZYWOŁANY?", 
                        room: currentRoom, 
                        timestamp: serverTimestamp(),
                        isBot: true
                    });
                }, 800);
            }
        }

        function parseEmotes(text) {
            if(!text) return "";
            return text.replace(/:bebzun:/g, `<img src="Bebe.jpg" class="emoji">`)
                       .replace(/:pou:/g, `<img src="pou.png" class="emoji">`);
        }

        async function sendMessage() {
            const msgInp = document.getElementById('message');
            const fileInp = document.getElementById('imageInput');
            const file = fileInp.files[0];
            let imgData = null;
            let val = msgInp.value.trim();

            if (file) {
                const reader = new FileReader();
                imgData = await new Promise(r => { 
                    reader.onload = e => r(e.target.result); 
                    reader.readAsDataURL(file); 
                });
            }

            if (val || imgData) {
                let targetRoom = currentRoom;
                
                const dmMatch = val.match(/^@([a-zA-Z0-9_]+)\s*(.*)/);
                if (dmMatch) {
                    const targetUser = dmMatch[1];
                    const cleanText = dmMatch[2];
                    
                    if (targetUser === loggedUser) {
                        alert("Nie możesz pisać DM do samego siebie!");
                        return;
                    }

                    targetRoom = getDMChannelId(loggedUser, targetUser);
                    val = cleanText;

                    if(!currentRoom.startsWith('dm_')) {
                        openDMRoom(targetUser);
                    }
                }

                if (val || imgData) {
                    await addDoc(collection(db, "messages"), {
                        user: loggedUser, 
                        text: val, 
                        image: imgData,
                        room: targetRoom, 
                        timestamp: serverTimestamp()
                    });
                    
                    if(val && !targetRoom.startsWith('dm_')) botBebzun(val);

                    msgInp.value = ""; 
                    fileInp.value = "";
                }
            }
        }

        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('message').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
        document.getElementById('btn-img').onclick = () => document.getElementById('imageInput').click();
        document.getElementById('header-logo').onclick = () => {
            document.body.style.filter = "hue-rotate(180deg)";
            setTimeout(() => document.body.style.filter = "none", 2000);
        };

        window.removeMsg = async (id) => { 
            if(confirm("Usunąć wiadomość?")) await deleteDoc(doc(db, "messages", id)); 
        };

    // no smores? :(
    
        let unsubscribe;
        function listenToMessages() {
            if (unsubscribe) unsubscribe();
            const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
            unsubscribe = onSnapshot(q, async (snap) => {
                const win = document.getElementById('chat-window');
                win.innerHTML = "";

                for (const d of snap.docs) {
                    const data = d.data();
                    if (data.room === currentRoom) {
                        const isMe = data.user === loggedUser;
                        const isBot = data.user === "Bebzun 🤖";
                        const isDM = data.room.startsWith('dm_');

                        let roleBadge = "";
                        if (!isBot) {
                            const uRole = await getUserRole(data.user);
                            roleBadge = getRoleBadgeHTML(data.user, uRole);
                        }

                        const div = document.createElement('div');
                        div.className = `msg ${isMe ? 'msg-right' : 'msg-left'} ${isBot ? 'msg-bot' : ''} ${isDM ? 'msg-dm' : ''}`;
                        
                        div.innerHTML = `
                            <span class="user" ${isBot ? 'style="color:#ffcc00"' : ''}>
                                ${isBot ? `<img src="Bebe.jpg" style="width:18px;height:18px;border-radius:50%">` : ''}
                                <span>${data.user}</span>
                                ${roleBadge}
                                ${isDM ? '<span class="dm-badge">DM</span>' : ''}
                            </span>
                            <span class="text">${parseEmotes(data.text)}</span>
                            ${data.image ? `<img src="${data.image}" class="chat-img" onclick="window.open(this.src)">` : ""}
                            ${isMe ? `<button class="del-btn" onclick="removeMsg('${d.id}')">X</button>` : ""}
                        `;
                        win.appendChild(div);
                    }
                }
                win.scrollTop = win.scrollHeight;
            });
        }

        window.toggleFriendsMenu = function() {
            const menu = document.getElementById('friends-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        };

        async function loadFriends() {
            if(!loggedUser || loggedUser === "Gość") return;
            const friendsRef = doc(db, "friends_lists", loggedUser);
            onSnapshot(friendsRef, (snap) => {
                const menu = document.getElementById('friends-menu');
                menu.innerHTML = '<strong>ZNAJOMI:</strong>';
                if(snap.exists() && snap.data().friendsList && snap.data().friendsList.length > 0) {
                    snap.data().friendsList.forEach(f => {
                        const item = document.createElement('div');
                        item.className = 'friend-item';
                        item.innerHTML = `<span>👤 ${f}</span> <span style="font-size:0.7em; color:#ff00ff;">💬 DM</span>`;
                        item.onclick = () => {
                            openDMRoom(f);
                            document.getElementById('friends-menu').style.display = 'none';
                        };
                        menu.appendChild(item);
                    });
                } else {
                    menu.innerHTML += '<div style="font-size:0.7rem; color:#888; margin-top:5px;">Brak znajomych.</div>';
                }
            });
        }

        window.openDMRoom = function(targetUser) {
            const dmRoomId = getDMChannelId(loggedUser, targetUser);
            let btn = document.getElementById(`btn-${dmRoomId}`);
            
            if(!btn) {
                const roomsBar = document.getElementById('rooms-bar');
                btn = document.createElement('button');
                btn.id = `btn-${dmRoomId}`;
                btn.className = 'room-btn';
                btn.innerText = `✉️ ${targetUser}`;
                btn.onclick = () => switchRoom(dmRoomId, 'Bebe.jpg', `DM z ${targetUser} ✉️`);
                roomsBar.appendChild(btn);
            }
            
            const input = document.getElementById('message');
            if(!input.value.startsWith(`@${targetUser}`)) {
                input.value = `@${targetUser} `;
            }
            
            switchRoom(dmRoomId, 'Bebe.jpg', `DM z ${targetUser} ✉️`);
        };

        loadFriends();
        listenToMessages();
    </script>
</body>
</html>
