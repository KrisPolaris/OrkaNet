<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOURTEXTHERE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');

    :root {
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #fcee0a;
      --bg-dark: #080811;
      --card-bg: rgba(16, 16, 32, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      /* Cyberpunkowa siatka w tle */
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 85, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Efekt poświaty tła */
    body::before {
      content: "";
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,243,255,0.15) 0%, rgba(255,0,85,0.1) 40%, rgba(0,0,0,0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: 90%;
      max-width: 900px;
      background: var(--card-bg);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
      padding: 2.5rem;
      text-align: center;
      position: relative;
      /* Ścięte narożniki w stylu cyberpunk */
      clip-path: polygon(
        0 0, 
        calc(100% - 30px) 0, 100% 30px, 
        100% 100%, 
        30px 100%, 0 calc(100% - 30px)
      );
    }

    /* Ozdobny pasek u góry */
    .container::before {
      content: "( ͡° ͜ʖ ͡°)";
      position: absolute;
      top: 0;
      left: 0;
      background: var(--neon-cyan);
      color: #000;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 10px;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 
        2px 2px var(--neon-pink),
        -2px -2px var(--neon-cyan);
      margin-top: 1rem;
      margin-bottom: 1rem;
      position: relative;
    }

    p {
      font-size: 1.2rem;
      color: #a0a0c0;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      text-transform: uppercase;
    }

    /* Kontener dla iframe z efektem neonowej ramki */
    .iframe-wrapper {
      display: inline-block;
      position: relative;
      padding: 5px;
      background: linear-gradient(45deg, var(--neon-pink), var(--neon-cyan));
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .iframe-wrapper:hover {
      transform: scale(1.03);
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.8);
    }

    iframe {
      display: block;
      border: none;
      background: #000;
    }

    /* Akcenty ozdobne */
    .cyber-badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 5px 15px;
      border: 1px solid var(--neon-yellow);
      color: var(--neon-yellow);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Ghost Pizza XD</h1>
    <p>"czemu ten helikopter sra pieniędzmi" -Krystian 2026r.</p>
    
    <div class="iframe-wrapper">
      <iframe src="https://yaksgames.com/games/ghost-pizza/G06F729087?play" width="250" height="450" scrolling="none" frameborder="0" allowfullscreen></iframe>
    </div>

</body>
</html>
