<script>
function feelingLucky() {
    const query = document.getElementById('searchQuery').value;
    if (query.trim() === "") {
        window.location.href = "https://www.google.com";
    } else {
        window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query) + "&btnI=1";
    }
}
</script>
